<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Are you playing?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap">
<style>
:root{--navy:#22408E;--navy-dk:#142A63;--mag:#C63A72;--grn:#2F7D5D;--grn-dk:#1C5A40;--grn-soft:#E3F2EB;--mag-soft:#FBEAF1;--ink:#1C2440;--muted:#5C6378;--well:#EEF1F6;
  --sh-lg:0 2px 0 #D4D8E0,0 24px 32px -16px rgba(28,40,80,.40),0 8px 12px -8px rgba(28,40,80,.18);--sh-sm:0 2px 0 #D4D8E0,0 10px 16px -8px rgba(28,40,80,.38);color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(130% 60% at 15% 0%,#FFFFFF 0%,#EEF0F4 45%,#DDE1E8 100%) fixed,#EEF0F4;color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.35;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ev{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.day{display:flex;gap:14px;align-items:center;padding:14px;border-radius:24px;background:#FFF;box-shadow:var(--sh-lg)}
.cal{width:70px;height:78px;flex:none;border-radius:16px;background:#FFF;box-shadow:var(--sh-sm);overflow:hidden;display:flex;flex-direction:column;align-items:center}
.cal i{font-style:normal;align-self:stretch;height:22px;background:var(--navy);color:#FFF;font-size:11px;font-weight:800;letter-spacing:.14em;display:grid;place-items:center}
.cal b{font-size:36px;font-weight:900;color:var(--navy);line-height:54px}
.day strong{display:block;font-size:20px}.day span{color:var(--muted);font-size:15px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{height:110px;border:0;border-radius:26px;font:inherit;font-size:19px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s}
.choice button:active{transform:translateY(3px)}
.choice button:disabled{opacity:.6;cursor:default}
.in{background:var(--grn);color:#FFF;box-shadow:0 4px 0 var(--grn-dk),0 14px 20px -12px rgba(28,90,64,.7)}
.out{background:#FFF;color:var(--mag);box-shadow:var(--sh-sm)}
.choice svg{width:32px;height:32px}
.note{margin:0;text-align:center;color:var(--muted);font-size:15px}
.done{border-radius:26px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.done.yes{background:var(--grn-soft)}.done.no{background:var(--mag-soft)}
.badge{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#FFF}
.yes .badge{background:var(--grn);box-shadow:0 4px 0 var(--grn-dk)}.no .badge{background:var(--mag);box-shadow:0 4px 0 #8E2350}
.done h2{margin:6px 0 0;font-size:24px;font-weight:900}.yes h2{color:var(--grn-dk)}.no h2{color:#7A1F45}
.done p{margin:0;font-size:16px}
.change{border:0;background:transparent;color:var(--navy);font:inherit;font-weight:700;text-decoration:underline;padding:10px;min-height:44px;cursor:pointer}
.err{border-radius:20px;background:#FFF;box-shadow:var(--sh-sm);padding:18px;text-align:center}
.skel{height:22px;border-radius:12px;background:linear-gradient(90deg,#E6E9EF,#F4F6F9,#E6E9EF);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
button:focus-visible{outline:3px solid #E6B12A;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="skel" style="width:40%"></div><div class="skel" style="height:34px;width:80%"></div><div class="skel" style="height:106px;border-radius:24px"></div>
</main>
<script>
(function(){
  const q=new URLSearchParams(location.search), sid=q.get('s')||'', tok=q.get('t')||'', day=q.get('d')||'';
  const app=document.getElementById('app');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const base=/^[\w-]{10,}$/.test(sid)?'https://script.google.com/macros/s/'+sid+'/exec':'';
  const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const CROSS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  let info=null;
  function err(msg){ app.innerHTML=`<div class="err"><h1 style="font-size:22px">Something’s not right</h1><p>${esc(msg)}</p></div>`; }
  async function call(params){
    const r=await fetch(base+'?'+new URLSearchParams(params).toString(),{redirect:'follow'});
    if(!r.ok) throw new Error('Could not reach the sign-up sheet. Please try again.');
    return r.json();
  }
  function header(){
    const [y,m,d]=info.date.split('-').map(Number), dt=new Date(y,m-1,d);
    return `<span class="ev">${esc(info.event)}</span>`+
      `<div class="day"><span class="cal" aria-hidden="true"><i>${dt.toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</i><b>${d}</b></span><div><strong>${esc(info.dateText)}</strong><span>${esc(info.time)}</span></div></div>`;
  }
  function ask(){
    app.innerHTML=`<h1>Hi ${esc(info.first)}! Are you playing?</h1>${header()}
      <div class="choice"><button type="button" class="in" data-a="in">${CHECK}I’m in</button><button type="button" class="out" data-a="out">${CROSS}Can’t make it</button></div>
      <p class="note">Your answer only goes to the organizer.</p>`;
  }
  function done(){
    const yes=info.answer==='in';
    app.innerHTML=`${header()}<div class="done ${yes?'yes':'no'}"><span class="badge">${yes?CHECK.replace('<svg','<svg width="36" height="36"'):CROSS.replace('<svg','<svg width="36" height="36"')}</span>
      <h2>${yes?`You’re in, ${esc(info.first)}!`:`Thanks for letting me know, ${esc(info.first)}.`}</h2>
      <p>${yes?`See you ${esc(info.dateText.split(',')[0])} at ${esc(info.time)}.`:'Hope to see you next time.'}</p></div>
      <button type="button" class="change" data-change="1">Plans changed? Change my answer</button>`;
  }
  app.addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.change){ ask(); return; }
    if(b.dataset.a){ app.querySelectorAll('.choice button').forEach(x=>x.disabled=true); b.textContent='Saving…';
      try{ const r=await call({api:'answer',t:tok,d:day,a:b.dataset.a}); if(!r.ok) return err(r.error); info=r; done(); }
      catch(x){ err(x.message||'Could not save your answer. Please try again.'); } }
  });
  if(!base||!tok||!/^\d{4}-\d{2}-\d{2}$/.test(day)) return err('This link is incomplete. Please use the button in the email.');
  call({api:'info',t:tok,d:day}).then(r=>{ if(!r.ok) return err(r.error); info=r; document.title=r.event+': are you playing?'; r.answer?done():ask(); })
    .catch(x=>err(x.message||'Could not load. Please try again.'));
})();
</script>
</body>
</html>
